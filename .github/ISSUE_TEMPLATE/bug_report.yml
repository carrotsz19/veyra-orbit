name: Report a bug
description: Something in Veyra Orbit isn't working.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Everything you post here is public.** Before sending, check your text and screenshots for your email, name, account names, open tabs or anything else personal, and blur or crop it out.
        Found a security problem? Please don't post it here. Use **Security → Report a vulnerability** instead, so it stays private.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen
      placeholder: |
        1. Open ...
        2. Click ...
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Orbit version
      description: Settings → Updates shows it.
      placeholder: "26.11.2"
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I've checked my text and screenshots for personal details.
          required: true
